name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:react18
        if: matrix.node == '22'
      - run: pnpm size
      - name: The built package loads as ESM and as CommonJS
        run: |
          node --input-type=module -e "import('@tarjim/core').then((m) => { if (typeof m.createRuntime !== 'function') process.exit(1) })"
          node -e "if (typeof require('@tarjim/core').createRuntime !== 'function') process.exit(1)"
          node --input-type=module -e "import('@tarjim/core/internal').then((m) => { if (typeof m.createDeliveryClient !== 'function') process.exit(1) })"
          node -e "if (typeof require('@tarjim/core/internal').createDeliveryClient !== 'function') process.exit(1)"
        working-directory: packages/core
      - name: The built browser package loads as ESM and as CommonJS
        run: |
          node --input-type=module -e "import('@tarjim/browser').then((m) => { if (typeof m.Tarjim.start !== 'function') process.exit(1) })"
          node -e "if (typeof require('@tarjim/browser').Tarjim.start !== 'function') process.exit(1)"
          node --input-type=module -e "import('@tarjim/browser/internal').then((m) => { if (typeof m.openStore !== 'function') process.exit(1) })"
          node -e "if (typeof require('@tarjim/browser/internal').openStore !== 'function') process.exit(1)"
        working-directory: packages/browser

  browser:
    name: browser (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm test:browser --project=${{ matrix.browser }}

  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck scripts/*.sh
      - run: scripts/secret-scan.sh
