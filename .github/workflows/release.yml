name: Release

on:
  push:
    tags: ["reference-v*"]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  # Runs the dependency tree, so it gets no write token: a compromised dev dependency must not be
  # able to replace a release asset.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: scripts/secret-scan.sh

  # Installs nothing and runs only this repository's shell scripts and gh.
  publish:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: scripts/release-reference.sh --tag "$GITHUB_REF_NAME" --out dist
      # Every tag is published as a pre-release. Making one customer-facing is a deliberate,
      # separate step (see CLAUDE.md).
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --title "$GITHUB_REF_NAME" --notes-file dist/notes.md dist/tarjim-reference.js dist/tarjim-reference.js.sha256
        env:
          GH_TOKEN: ${{ github.token }}
      - name: The published asset is the committed file
        run: |
          set -euo pipefail
          mkdir check
          gh release download "$GITHUB_REF_NAME" --pattern tarjim-reference.js --dir check
          cmp reference/tarjim-reference.js check/tarjim-reference.js
        env:
          GH_TOKEN: ${{ github.token }}
